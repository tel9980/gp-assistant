name: Release Windows installer + portable

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (留空 = v<version>-ci.<run_number>)"
        required: false
      prerelease:
        description: "标记为预发布"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build NSIS installer + portable (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      TAG_INPUT: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install npm deps (desktop)
        working-directory: desktop
        run: npm ci

      - name: Install npm deps (frontend)
        working-directory: desktop/frontend
        run: npm ci

      # tauri 打包 NSIS 前要从 GitHub Releases 现下 nsis-3.13.zip，
      # 上游 504 会让整个打包失败（run 41999957652 就是这么挂的）→ 缓存 tools 目录复用
      - name: Cache tauri bundler tools (NSIS)
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\tauri
          key: tauri-bundler-tools-${{ runner.os }}-nsis-3.13-v1

      # build:windows = prepare:windows（拉 RAG 模型 + 构建前端 + 准备 Android 资源）
      #                + tauri build --features gepa-lab --config tauri.skip-beforebuild.json
      - name: Build installer
        working-directory: desktop
        run: npm run build:windows

      - name: Locate installer
        id: locate
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Path desktop/src-tauri/target/release/bundle/nsis -Filter *.exe |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer not found" }
          Write-Host "installer: $($exe.FullName) ($([math]::Round($exe.Length/1MB,1)) MB)"
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      # NSIS 产物名来自 productName「股选优」，非 ASCII 会被清成空中缀（_0.6.3_x64-setup.exe）
      # 这里统一改成与历史发布一致的 guxuanyou_<version>_windows_x64_setup.exe
      - name: Normalize installer name
        id: rename
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $dest = Join-Path "desktop/src-tauri/target/release/bundle/nsis" "guxuanyou_${version}_windows_x64_setup.exe"
          Copy-Item -LiteralPath "${{ steps.locate.outputs.path }}" -Destination $dest -Force
          "path=$dest" >> $env:GITHUB_OUTPUT
          "name=$(Split-Path $dest -Leaf)" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ steps.rename.outputs.path }}
          if-no-files-found: error

      # 免安装版：主程序 + 同目录 models/（RAG 本地向量模型）。
      # Tauri 对未安装的 exe 会把 resource_dir() 解析成 exe 所在目录，
      # 所以 model 必须和 exe 放同一个文件夹（src-tauri/src/research.rs: research_embedding_model_dir）。
      - name: Package portable (免安装)
        id: portable
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $root = "dist/portable/guxuanyou_${version}_windows_x64"
          Remove-Item -Recurse -Force "dist" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          $exe = "desktop/src-tauri/target/release/stock-optimizer-desktop.exe"
          if (-not (Test-Path $exe)) { throw "portable binary not found: $exe" }
          Copy-Item -LiteralPath $exe -Destination (Join-Path $root "guxuanyou.exe") -Force

          if (Test-Path "models") {
            Copy-Item -Recurse -Force "models" (Join-Path $root "models")
            Write-Host "bundled models: $((Get-ChildItem -Recurse models -File | Measure-Object Length -Sum).Sum / 1MB) MB"
          } else {
            Write-Warning "models/ 不存在：免安装包将缺少本地向量模型（研究检索会降级）"
          }
          Copy-Item -LiteralPath "README.md" -Destination $root -ErrorAction SilentlyContinue

          $zip = "dist/guxuanyou_${version}_windows_x64_portable.zip"
          Compress-Archive -Path (Join-Path $root "*") -DestinationPath $zip -Force
          $single = "dist/guxuanyou_${version}_windows_x64_portable.exe"
          # 单文件版（仅主程序，解压后需自行放 models/ 才能用本地向量检索）
          Copy-Item -LiteralPath $exe -Destination $single -Force

          foreach ($f in @($zip, $single)) { Write-Host "$f $([math]::Round((Get-Item $f).Length/1MB,1)) MB" }
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "single=$single" >> $env:GITHUB_OUTPUT

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            ${{ steps.portable.outputs.zip }}
            ${{ steps.portable.outputs.single }}
          if-no-files-found: error

      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $tag = $env:TAG_INPUT
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "v$version-ci.${{ github.run_number }}" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "release tag: $tag"

      - name: Publish release
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $exe = "${{ steps.rename.outputs.path }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "股选优 $tag" --notes "CI 构建（commit ${{ github.sha }}）。未做 Authenticode 签名，首次运行会有 SmartScreen 提示。

          - guxuanyou_*_windows_x64_setup.exe：安装版（NSIS）
          - guxuanyou_*_windows_x64_portable.zip：免安装版，解压即用（含本地向量模型 models/）
          - guxuanyou_*_windows_x64_portable.exe：免安装单文件版，仅主程序（需要本地向量检索时把 models/ 放到同目录）

          免安装版依赖系统自带的 WebView2 运行时（Win10 1803+ / Win11 默认就有）。" --prerelease
          }
          Copy-Item -LiteralPath "${{ steps.portable.outputs.zip }}" -Destination "." -Force
          Copy-Item -LiteralPath "${{ steps.portable.outputs.single }}" -Destination "." -Force
          gh release upload $tag $exe --clobber
          gh release upload $tag (Split-Path "${{ steps.portable.outputs.zip }}" -Leaf) --clobber
          gh release upload $tag (Split-Path "${{ steps.portable.outputs.single }}" -Leaf) --clobber
