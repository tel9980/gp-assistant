name: Publish dev/eval image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docker/eval.Dockerfile"
      - ".dockerignore"
      - ".github/workflows/release-docker.yml"
      - "desktop/frontend/package.json"
      - "desktop/package.json"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gp-assistant-dev

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/eval.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:v${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=gp-assistant dev/eval image
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### 镜像已推送"
            echo
            echo '```'
            echo "$IMAGE:latest"
            echo "$IMAGE:v${{ steps.ver.outputs.version }}"
            echo "$IMAGE:sha-${{ github.sha }}"
            echo '```'
            echo
            echo "用法：\`docker run --rm -v \"\$PWD\":/workspace $IMAGE:latest node scripts/verify.mjs\`"
          } >> "$GITHUB_STEP_SUMMARY"
