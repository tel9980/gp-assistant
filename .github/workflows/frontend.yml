name: Frontend and core checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck / unit / bundle budget)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install
        working-directory: desktop/frontend
        run: npm ci

      - name: Typecheck + build
        working-directory: desktop/frontend
        run: npm run build:app

      - name: Unit tests
        working-directory: desktop/frontend
        run: npx vitest run --config vitest.config.ts

      # 只覆盖 src/lib（IPC 包装/存储/解析），阈值见 vitest.config.ts
      - name: Coverage (src/lib)
        working-directory: desktop/frontend
        run: npm run test:coverage -- --coverage.reporter=text-summary

      # Rust 命令名/形参与前端 invoke 调用点是否对得上
      - name: IPC contract
        run: node scripts/check-ipc-contract.mjs

      - name: Bundle budget
        working-directory: desktop/frontend
        run: npm run test:bundle

      - name: Contract scripts (CSS / 触摸目标 / 主题 / 密度 / 版本)
        working-directory: desktop/frontend
        run: |
          node ../../scripts/check-version-consistency.mjs
          node ../../scripts/check-color-contract.mjs
          node ../../scripts/check-ui-touch-targets.mjs
          node ../../scripts/check-css-architecture.mjs
          node ../../scripts/check-unstyled-classes.mjs
          node ../../scripts/check-ui-density.mjs
          node ../../scripts/check-theme-parity.mjs

  core:
    name: gp-core (fmt / clippy / tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/gp-core

      # gp-core 的 Tauri 依赖在 Linux 上需要这些系统库
      - name: System libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev patchelf

      - name: cargo test --lib
        working-directory: native/gp-core
        run: cargo test --lib

      - name: cargo fmt --check
        working-directory: native/gp-core
        run: cargo fmt --check

      # gp-core 已清零（2026-11-05），从这里开始 -D warnings 防回潮。
      # desktop/src-tauri 那侧还有历史警告，暂不在本 job 阻断。
      - name: cargo clippy -D warnings
        working-directory: native/gp-core
        run: cargo clippy --all-targets --message-format short -- -D warnings

  # 桌面壳（desktop/src-tauri）以前只在 25 分钟的 Windows 打包里才编译，
  # 改 Rust 侧代码要等很久才发现编译错。这里单独跑 cargo check 做快速反馈。
  tauri-check:
    name: desktop shell (cargo check)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: System libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev patchelf

      # tauri::generate_context!() 会在编译期读取 tauri.conf.json 里的 frontendDist
      # （../mobile-dist），目录不存在就直接 proc macro panic，所以先构建前端。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Build frontend (for frontendDist)
        working-directory: desktop/frontend
        run: npm ci && npm run build:app

      - name: cargo check
        working-directory: desktop/src-tauri
        run: cargo check --all-targets --features gepa-lab --message-format short

      - name: cargo fmt --check
        working-directory: desktop/src-tauri
        run: cargo fmt --check
